name: Heap leak test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  leak:
    runs-on: ubuntu-latest
    outputs:
      plot: ${{ steps.pages.outputs.plot }}
    steps:
      - uses: actions/checkout@v7

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32s3

      - name: Leak test (200 requests)
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          scenario: scenarios/leak.test.yaml
          timeout: 60000
          heap_interval: 500
          heap_min_free: 350000
          heap_csv: heap.csv

      - uses: actions/setup-python@v7
        if: always()
        with:
          python-version: '3.x'

      - name: Plot heap samples
        if: always() && hashFiles('heap.csv') != ''
        run: |
          pip install matplotlib
          python scripts/plot-heap.py heap.csv --limit 350000

      - name: Upload heap samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heap
          path: |
            heap.csv
            heap.png

      # Job summaries only show hosted images, so pushes to the default branch publish the plot on
      # GitHub Pages (Settings > Pages > Source: GitHub Actions). Pull requests keep it in the artifact.
      - name: Prepare the plot for GitHub Pages
        id: pages
        if: always() && hashFiles('heap.png') != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          mkdir -p "site/runs/${{ github.run_id }}"
          cp heap.png "site/runs/${{ github.run_id }}/"
          echo "plot=runs/${{ github.run_id }}/heap.png" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        if: always() && steps.pages.outcome == 'success'
        with:
          path: site

  pages:
    needs: leak
    if: always() && needs.leak.outputs.plot != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Show the plot in the job summary
        run: echo "![Free heap during the leak test](${{ steps.deployment.outputs.page_url }}${{ needs.leak.outputs.plot }})" >> "$GITHUB_STEP_SUMMARY"
